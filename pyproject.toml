[project]
name = "anomaly-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nicolas Grislain", email = "nicolas.grislain@datadoghq.com" }
]
requires-python = ">=3.12"
